<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đường lên đỉnh yaoi</title> <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">Đường lên đỉnh yaoi</div> <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm tên truyện, tác giả, tag...">
            <i class="fas fa-search"></i>
        </div>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">Tất cả</button>
        <button class="filter-btn" data-filter="reading">Đang đọc</button>
        <button class="filter-btn" data-filter="completed">Đã xong</button>
    </div>

    <main class="manga-grid" id="mangaGrid">
        </main>

    <script src="script.js"></script>
</body>
</html>
